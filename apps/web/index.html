<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Negotiated Memory — AI memory that asks first</title>
    <meta
      name="description"
      content="Every other AI decides what to remember. This one asks. Approve each fact and choose whether it lives for one conversation, one project, or everywhere."
    />
    <script>
      // Apply the stored theme before first paint so a dark-mode reload never flashes white.
      // Mirrors the logic in @workspace/ui/components/theme-provider.
      ;(() => {
        try {
          const stored = localStorage.getItem("theme")
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.classList.add(theme)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
